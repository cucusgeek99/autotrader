[project]
name = "autotrader"
version = "0.1.0"
description = "Self-tuning crypto trading lab: optimizes strategies, validates walk-forward, remembers what works, paper-trades the champion."
requires-python = ">=3.10"
dependencies = [
    "ccxt>=4.2",
    "pandas>=2.0",
    "numpy>=1.24",
    "optuna>=3.5",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["anthropic>=0.40", "pydantic>=2.0"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
stream = ["websockets>=12.0"]

[project.scripts]
autotrader = "autotrader.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autotrader*"]
